
name: Portfolio CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t portfolio:ci .

      - name: Check Ansible playbook syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml \
            --syntax-check

  deploy:
    name: Deploy portfolio to EC2
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible and SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible openssh-client

      - name: Configure SSH key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/portfolio_cd
          chmod 600 ~/.ssh/portfolio_cd

      - name: Configure SSH host verification
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_KNOWN_HOSTS"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create temporary Ansible inventory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          printf '[webservers]\nportfolio-server ansible_host=%s ansible_user=%s ansible_ssh_private_key_file=/home/runner/.ssh/portfolio_cd ansible_ssh_common_args="-o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"\n' \
            "$EC2_HOST" "$EC2_USER" > /tmp/portfolio-inventory.ini

      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -i ~/.ssh/portfolio_cd \
              "$EC2_USER@$EC2_HOST" \
              'echo SSH connection successful'

      - name: Deploy website with Ansible
        run: |
          ansible-playbook \
            -i /tmp/portfolio-inventory.ini \
            ansible/deploy.yml
